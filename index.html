<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduSpace Learning — Learn More. Grow Further.</title>
    <meta name="description" content="EduSpace Learning: a modern bilingual educational platform with courses in design, technology, business, and more." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('eduspace-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.classList.toggle('dark', t === 'dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
          var lang = localStorage.getItem('eduspace-lang');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
